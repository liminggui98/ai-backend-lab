# 导入 .env 文件
spring.config.import=optional:classpath:.env[.properties]
# deepseek
llm.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
llm.deepseek.api-key=${DEEPSEEK_API_KEY:}
llm.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
llm.deepseek.request-timeout=${DEEPSEEK_REQUEST_TIMEOUT:60}
llm.deepseek.connect-timeout=${DEEPSEEK_CONNECT_TIMEOUT:10}
llm.deepseek.temperature=${DEEPSEEK_TEMPERATURE:0.7}
# zhipu
llm.zhipu.base-url=${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
llm.zhipu.api-key=${ZHIPU_API_KEY:}
llm.zhipu.model=${ZHIPU_MODEL:glm-4-flash}
llm.zhipu.request-timeout=${ZHIPU_REQUEST_TIMEOUT:60}
llm.zhipu.connect-timeout=${ZHIPU_CONNECT_TIMEOUT:10}
llm.zhipu.temperature=${ZHIPU_TEMPERATURE:0.7}
# bailian
llm.bailian.base-url=${BAILIAN_BASE_URL:}
llm.bailian.api-key=${BAILIAN_API_KEY:}
llm.bailian.model=${BAILIAN_MODEL:qwen-plus}
llm.bailian.request-timeout=${BAILIAN_REQUEST_TIMEOUT:60}
llm.bailian.connect-timeout=${BAILIAN_CONNECT_TIMEOUT:10}
llm.bailian.temperature=${BAILIAN_TEMPERATURE:0.7}