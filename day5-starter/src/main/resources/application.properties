# 导入 .env 文件
spring.config.import=optional:file:.env[.properties]

# deepseek
llm.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
llm.deepseek.api-key=${DEEPSEEK_API_KEY:}
